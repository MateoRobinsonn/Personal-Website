<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Mateo Robinson — Software Engineer</title>
    <meta
      name="description"
      content="Mateo Robinson is a software engineer and Computer Science student at the University of Washington building full-stack products with React, Node.js, and cloud infrastructure."
    />
    <meta property="og:title" content="Mateo Robinson — Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Mateo Robinson: experience, projects, and skills in full-stack software engineering."
    />
    <meta property="og:type" content="website" />
    <script>
      // Set the theme class before first paint to avoid a flash of the
      // wrong theme. Kept tiny and dependency-free on purpose.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
